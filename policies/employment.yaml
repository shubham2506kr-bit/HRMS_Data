# ============================================================
apiVersion: "api.cerbos.dev/v1"
kind: Policy
metadata:
  name: department
  namespace: edurankai
spec:
  target: department
  permissions:
    - action: read
      effect: ALLOW
    - action: create
      effect: ALLOW
    - action: update
      effect: ALLOW
    - action: delete
      effect: DENY
    - action: self
      effect: ALLOW
    - action: department_head_of
      effect: ALLOW
    - action: hr_generalist
      effect: ALLOW
    - action: platform_admin
      effect: ALLOW
    - action: hr_restricted
      effect: ALLOW
  rules:
    - description: "Self access"
      effect: ALLOW
      actions: ["read"]
      roles: ["self"]
    - description: "Department head access"
      effect: ALLOW
      actions: ["read", "write"]
      roles: ["department_head_of"]
      condition:
        match:
          expr: "request.resource.attr.head_of_department_id == request.principal.id"
    - description: "HR generalist full access"
      effect: ALLOW
      actions: ["*"]
      roles: ["hr_generalist"]
    - description: "Platform admin full access"
      effect: ALLOW
      actions: ["*"]
      roles: ["platform_admin"]
    - description: "HR restricted subject-scoped"
      effect: ALLOW
      actions: ["read"]
      roles: ["hr_restricted"]
      condition:
        match:
          expr: "request.resource.attr.person_id == request.principal.id"


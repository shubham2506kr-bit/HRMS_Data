# ============================================================
# health_record.yaml (BLOCKED - Section 6)
# ============================================================
apiVersion: "api.cerbos.dev/v1"
kind: Policy
metadata:
  name: health_record
  namespace: edurankai
spec:
  target: health_record
  permissions:
    - action: read
      effect: ALLOW
    - action: create
      effect: DENY
    - action: update
      effect: DENY
    - action: delete
      effect: DENY
    - action: self
      effect: ALLOW
    - action: health_service
      effect: ALLOW
  rules:
    # Subject-only access - only the subject can read their own health records
    - description: "Subject-only read access"
      effect: ALLOW
      actions: ["read"]
      roles: ["self"]
      condition:
        match:
          expr: "request.resource.attr.person_id == request.principal.id"
    # Health service (subject-scoped connection) can read/write
    - description: "Health service full access"
      effect: ALLOW
      actions: ["read", "create", "update"]
      roles: ["health_service"]
    # No one else can access health records
    - description: "No other access"
      effect: DENY
      actions: ["*"]
      roles: ["*"]


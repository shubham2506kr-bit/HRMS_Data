# health_access_log.yaml
# ============================================================
apiVersion: "api.cerbos.dev/v1"
kind: Policy
metadata:
  name: health_access_log
  namespace: edurankai
spec:
  target: health_access_log
  permissions:
    - action: read
      effect: ALLOW
    - action: create
      effect: ALLOW
    - action: update
      effect: DENY
    - action: delete
      effect: DENY
    - action: self
      effect: ALLOW
    - action: health_service
      effect: ALLOW
    - action: platform_admin
      effect: ALLOW
  rules:
    - description: "Subject can read own access log"
      effect: ALLOW
      actions: ["read"]
      roles: ["self"]
      condition:
        match:
          expr: "request.resource.attr.accessor_id == request.principal.id"
    - description: "Health service full access"
      effect: ALLOW
      actions: ["read", "create"]
      roles: ["health_service"]
    - description: "Platform admin full access"
      effect: ALLOW
      actions: ["read", "create"]
      roles: ["platform_admin"]
# Cerbos Policies for EduRankAI HRMS
# Location: E:\HRMS_Data\policies\

# ============================================================
# leave_request.yaml
# ============================================================
apiVersion: "api.cerbos.dev/v1"
kind: Policy
metadata:
  name: leave_request
  namespace: edurankai
spec:
  target: leave_request
  permissions:
    - action: self
      effect: ALLOW
      description: "Employee can always read/create their own leave requests"
    - action: direct_manager_of
      effect: ALLOW
      description: "Direct manager can read/approve leave requests for direct reports"
    - action: manager_chain_of
      effect: ALLOW
      description: "Manager chain can read leave requests as of record date"
    - action: hr_generalist
      effect: ALLOW
      description: "HR generalist full access"
    - action: platform_admin
      effect: ALLOW
      description: "Platform admin full access"
    - action: hr_restricted
      effect: ALLOW
      description: "HR restricted subject-scoped access"
  rules:
    - description: "Self-access always allowed"
      effect: ALLOW
      permit:
        any_of:
          - out:
              action: self
          - out:
              action: direct_manager_of
              context:
                target_type: leave_request
                as_of_date: "{{request.context.date}}"
          - out:
              action: manager_chain_of
              context:
                target_type: leave_request
                as_of_date: "{{request.context.date}}"
    - description: "HR generalist and platform_admin full access"
      effect: ALLOW
      principals:
        - hr_generalist
        - platform_admin
    - description: "HR restricted subject-scoped"
      effect: ALLOW
      principals:
        - hr_restricted
      condition:
        match: "{{request.principal.subject}}"
        description: "HR restricted can only read leave requests belonging to authenticated subject"


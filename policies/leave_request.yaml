# ============================================================
# leave_request.yaml (detailed)
# ============================================================
apiVersion: "api.cerbos.dev/v1"
kind: Policy
metadata:
  name: leave_request
  namespace: edurankai
spec:
  target: leave_request
  permissions:
    - action: read
      effect: ALLOW
    - action: create
      effect: ALLOW
    - action: update
      effect: ALLOW
    - action: delete
      effect: DENY
    - action: approve
      effect: ALLOW
    - action: reject
      effect: ALLOW
    - action: cancel
      effect: ALLOW
    - action: self
      effect: ALLOW
    - action: direct_manager_of
      effect: ALLOW
    - action: manager_chain_of
      effect: ALLOW
    - action: hr_generalist
      effect: ALLOW
    - action: platform_admin
      effect: ALLOW
    - action: hr_restricted
      effect: ALLOW
  rules:
    # Self can always read and create
    - description: "Self read access"
      effect: ALLOW
      actions: ["read", "create"]
      roles: ["self"]
    - description: "Self update/cancel own requests"
      effect: ALLOW
      actions: ["update", "cancel"]
      roles: ["self"]
      condition:
        match:
          expr: "request.resource.attr.person_id == request.principal.id"
    # Direct manager can read/approve/reject for direct reports as of record date
    - description: "Direct manager read/approve/reject"
      effect: ALLOW
      actions: ["read", "approve", "reject"]
      roles: ["direct_manager_of"]
      condition:
        match:
          expr: |
            request.resource.attr.person_id in request.principal.attr.direct_reports &&
            request.context.date >= request.resource.attr.valid_period.start &&
            request.context.date <= request.resource.attr.valid_period.end
    # Manager chain can read as of record date
    - description: "Manager chain read access"
      effect: ALLOW
      actions: ["read"]
      roles: ["manager_chain_of"]
      condition:
        match:
          expr: |
            request.resource.attr.person_id in request.principal.attr.chain_of_reports &&
            request.context.date >= request.resource.attr.valid_period.start &&
            request.context.date <= request.resource.attr.valid_period.end
    # HR generalist full access
    - description: "HR generalist full access"
      effect: ALLOW
      actions: ["*"]
      roles: ["hr_generalist"]
    # Platform admin full access
    - description: "Platform admin full access"
      effect: ALLOW
      actions: ["*"]
      roles: ["platform_admin"]
    # HR restricted subject-scoped
    - description: "HR restricted subject-scoped"
      effect: ALLOW
      actions: ["read"]
      roles: ["hr_restricted"]
      condition:
        match:
          expr: "request.resource.attr.person_id == request.principal.id"


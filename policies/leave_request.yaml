# ============================================================
# attendance_event.yaml
# ============================================================
apiVersion: "api.cerbos.dev/v1"
kind: Policy
metadata:
  name: attendance_event
  namespace: edurankai
spec:
  target: attendance_event
  permissions:
    - action: read
      effect: ALLOW
    - action: create
      effect: ALLOW
    - action: delete
      effect: DENY
    - action: self
      effect: ALLOW
    - action: direct_manager_of
      effect: ALLOW
    - action: manager_chain_of
      effect: ALLOW
    - action: hr_generalist
      effect: ALLOW
    - action: platform_admin
      effect: ALLOW
  rules:
    # Self can read and create
    - description: "Self read/create"
      effect: ALLOW
      actions: ["read", "create"]
      roles: ["self"]
    # Self delete denied (append-only)
    - description: "Self cannot delete (append-only)"
      effect: DENY
      actions: ["delete"]
      roles: ["self"]
    # Direct manager read as of event date
    - description: "Direct manager read as of event date"
      effect: ALLOW
      actions: ["read"]
      roles: ["direct_manager_of"]
      condition:
        match:
          expr: |
            request.resource.attr.person_id in request.principal.attr.direct_reports &&
            request.context.date == request.resource.attr.occurred_at
    # Manager chain read as of event date
    - description: "Manager chain read as of event date"
      effect: ALLOW
      actions: ["read"]
      roles: ["manager_chain_of"]
      condition:
        match:
          expr: |
            request.resource.attr.person_id in request.principal.attr.chain_of_reports &&
            request.context.date == request.resource.attr.occurred_at
    # HR generalist full access
    - description: "HR generalist full access"
      effect: ALLOW
      actions: ["*"]
      roles: ["hr_generalist"]
    # Platform admin full access
    - description: "Platform admin full access"
      effect: ALLOW
      actions: ["*"]
      roles: ["platform_admin"]


# ============================================================
# employee_message.yaml
# ============================================================
apiVersion: "api.cerbos.dev/v1"
kind: Policy
metadata:
  name: employee_message
  namespace: edurankai
spec:
  target: employee_message
  permissions:
    - action: read
      effect: ALLOW
    - action: create
      effect: ALLOW
    - action: update
      effect: DENY
    - action: delete
      effect: DENY
    - action: self
      effect: ALLOW
    - action: hr_generalist
      effect: ALLOW
    - action: platform_admin
      effect: ALLOW
    - action: hr_restricted
      effect: ALLOW
  rules:
    - description: "Sender/recipient can read"
      effect: ALLOW
      actions: ["read"]
      roles: ["self"]
      condition:
        match:
          expr: "request.resource.attr.sender_id == request.principal.id || request.resource.attr.recipient_id == request.principal.id"
    - description: "Sender can create"
      effect: ALLOW
      actions: ["create"]
      roles: ["self"]
      condition:
        match:
          expr: "request.resource.attr.sender_id == request.principal.id"
    - description: "HR generalist full access"
      effect: ALLOW
      actions: ["*"]
      roles: ["hr_generalist"]
    - description: "Platform admin full access"
      effect: ALLOW
      actions: ["*"]
      roles: ["platform_admin"]
    - description: "HR restricted subject-scoped"
      effect: ALLOW
      actions: ["read"]
      roles: ["hr_restricted"]
      condition:
        match:
          expr: "request.resource.attr.recipient_id == request.principal.id"